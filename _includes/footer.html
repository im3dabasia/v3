<footer class="footer">
  <div class="footer__copyright">
    <div class="top">
      <span>Built by</span>
    </div>
    <div class="bottom">
      <span>Eshaan Dabasiya</span>
      <img class="emoji" src="{{site.baseurl}}/img/emojis/rockon.png" alt="emoji">
      <span>2026</span>
    </div>
    <div class="credit">
      <span>Design based on a template by
        <a href="https://brittanychiang.com/" target="_blank">Brittany Chiang</a></span>
    </div>
  </div>
  <div class="footer__links">
    {% for link in site.social %}
    <a href="{{link.url}}" target="_blank" title="{{link.title}}">
      <span class="text">{{link.title}}</span>
      <img src="{{site.baseurl}}/img/social/{{link.title | downcase}}.svg" alt="{{link.title}}">
    </a>
    {% endfor %}
  </div>
</footer>
