# The migrations series. `done` entries link through to a write-up at
# /migrations/<slug>/; `planned` ones are shown on the index only.
#
# `logo` is a key understood by _includes/logo.html — anything it does not
# recognise is drawn as a monogram tile instead, which is how AEM is handled.

- slug: drupal-to-wordpress
  number: '01'
  title: Drupal → WordPress
  status: done
  source:
    name: Drupal
    logo: drupal
    color: '#0678BE'
  target:
    name: WordPress
    logo: wordpress
    color: '#21759B'
  blurb: A whole Drupal site — articles, pages, recipes, tags and images — moved into WordPress without losing anything.
  # Swap in the real URL once the repo is public.
  repo: '#'

